name: Release

# Moves the major tag (v1) to the commit of each published release, so that
# `uses: LuisFernandes664/quality-ratchet@v1` always runs the latest v1.x.y.

on:
  release:
    types: [published]

permissions: {}

jobs:
  move-major-tag:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Move the major tag to the release commit
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag '$TAG' is not vMAJOR.MINOR.PATCH."
            exit 1
          fi
          MAJOR="${TAG%%.*}"
          git tag -f "$MAJOR" "$TAG^{commit}"
          git push -f origin "refs/tags/$MAJOR"
          echo "::notice::$MAJOR now points to $TAG ($(git rev-parse --short "$TAG^{commit}"))."
