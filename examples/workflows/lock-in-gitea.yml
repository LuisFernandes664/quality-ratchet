# lock-in-on-main.yml for Gitea and Forgejo Actions, where peter-evans/create-pull-request
# does not work: the last step pushes the tightened baseline to a branch with git and opens
# the pull request through the API. This repository's CI runs the last two steps on Gitea;
# Forgejo has the same API, but is not tested.
#
# Notes:
# - The lock-in pull request only tightens the baseline, so it needs no special title.
# - The branch is rebuilt from main and force-pushed on every run. While its pull request
#   is open the API answers 409 to a second one, and the push has already updated it.
# - Runs are not serialised (`concurrency` depends on the server version): with several
#   runners, an older run that finishes last leaves its values on the branch until the
#   next push to main.
# - When nothing is left to lock in, an open lock-in pull request is not closed: close it
#   by hand, or merge it and let the next push settle the baseline.
# - The checkout keeps the workflow token, which may push to the repository. Pull requests
#   opened with that token do not trigger other workflows: if branch protection requires
#   checks on it, pass the token of a user to `token` in the checkout and to TOKEN below.
# - `uses:` takes the full URL of this action: the short form only works on an instance
#   that resolves actions on GitHub. The image of the job needs Node.js 20 or later: see
#   "Gitea and Forgejo Actions" in the README.
name: Lock in quality improvements

on:
  push:
    branches: [main]

jobs:
  lock-in:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Collect reports
        run: |
          mkdir -p reports
          npx jest --coverage --coverageReporters=lcov
          npx eslint . -f json -o reports/eslint.json || [ $? -eq 1 ]

      - name: Quality ratchet
        id: ratchet
        # A regression that reached main (for example a forgiven hotfix) must not stop
        # the other metrics from being locked in: the new baseline never loosens.
        continue-on-error: true
        uses: https://github.com/LuisFernandes664/quality-ratchet@v2
        with:
          comment: false
          write-baseline: quality-baseline.json

      - name: Open the lock-in pull request
        # Only when the ratchet produced a result: after a configuration error nothing is
        # written.
        if: steps.ratchet.outputs.new-baseline != ''
        env:
          TOKEN: ${{ github.token }}
          BASELINE: quality-baseline.json
          BRANCH: quality-ratchet/lock-in
          TITLE: "chore: lock in quality improvements"
        run: |
          if git diff --quiet -- "$BASELINE"; then
            echo "Nothing to lock in."
            exit 0
          fi
          git checkout -B "$BRANCH"
          git -c user.name=quality-ratchet -c user.email=quality-ratchet@noreply.invalid \
            commit -m "$TITLE" -- "$BASELINE"
          git push --force origin "$BRANCH"
          response="$(mktemp)"
          status="$(curl -sS -o "$response" -w '%{http_code}' -X POST \
            -H "Authorization: token $TOKEN" -H 'Content-Type: application/json' \
            -d "{\"base\":\"$GITHUB_REF_NAME\",\"head\":\"$BRANCH\",\"title\":\"$TITLE\"}" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls")"
          # 409: the pull request is already open, and the push above updated it.
          if [ "$status" != 201 ] && [ "$status" != 409 ]; then
            cat "$response"
            exit 1
          fi
